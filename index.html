<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envie sua foto ou vídeo</title>
<script src="https://js.bytescale.com/upload-widget/v4"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f6e8e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .card { background: white; border-radius: 16px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; margin-bottom: 8px; color: #2b2320; }
  p { color: #6b5f57; font-size: 14px; margin-bottom: 24px; }
  .send-btn { display: inline-block; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; box-sizing: border-box; margin-bottom: 12px; border: none; background: #2b2320; color: white; }
  .send-btn:disabled { opacity: 0.5; }
  #status { margin-top: 16px; font-size: 14px; color: #2b2320; min-height: 20px; }
</style>
</head>
<body>
  <div class="card">
    <h1>📸 Envie sua foto ou vídeo</h1>
    <p>Compartilhe esse momento do nosso casamento com a gente!</p>
    <button class="send-btn" id="sendBtn">Escolher e enviar</button>
    <div id="status"></div>
  </div>

  <script>
    var sendBtn = document.getElementById('sendBtn');
    var statusDiv = document.getElementById('status');

    sendBtn.addEventListener('click', function() {
      var options = {
        apiKey: "public_kW2K8w89RM3bov5RPLomrhe2Z7DT",
        maxFileCount: 1,
        mimeTypes: ["image/*", "video/*"],
        showFinishButton: true,
        editor: { images: { crop: false } },
        styles: {
          colors: {
            primary: "#2b2320"
          }
        },
        locale: {
          addAnotherFileBtn: "Adicionar outro arquivo...",
          addAnotherImageBtn: "Adicionar outra imagem...",
          cancelBtn: "cancelar",
          cancelBtnClicked: "cancelado",
          cancelPreviewBtn: "Cancelar",
          continueBtn: "Continuar",
          cropBtn: "Cortar",
          customValidationFailed: "Falha ao validar arquivo.",
          doneBtn: "Concluído",
          fileSizeLimitPrefix: "Tamanho máximo:",
          finishBtn: "Finalizar",
          imageCropNumberPrefix: "Imagem",
          maxFilesReachedPrefix: "Número máximo de arquivos:",
          maxImagesReachedPrefix: "Número máximo de imagens:",
          orDragDropFile: "...ou arraste um arquivo aqui.",
          orDragDropFileMulti: "...ou arraste os arquivos aqui.",
          orDragDropImage: "...ou arraste uma foto aqui.",
          orDragDropImageMulti: "...ou arraste as fotos aqui.",
          processingFile: "Processando arquivo...",
          removeBtn: "remover",
          removeBtnClicked: "removido",
          retryBtn: "tentar de novo",
          retryBtnClicked: "tentativa refeita",
          submitBtnError: "Erro!",
          submitBtnLoading: "Aguarde...",
          unsupportedFileType: "Tipo de arquivo não suportado.",
          uploadFileBtn: "Enviar arquivo",
          uploadFileMultiBtn: "Enviar arquivos",
          uploadImageBtn: "Enviar foto",
          uploadImageMultiBtn: "Enviar fotos",
          xOfY: "de"
        }
      };

      Bytescale.UploadWidget.open(options).then(
        function(files) {
          if (files.length === 0) {
            statusDiv.textContent = '';
            return;
          }
          statusDiv.textContent = '✅ Enviado! Obrigado!';
        },
        function(error) {
          statusDiv.textContent = '❌ Erro ao enviar, tenta de novo.';
        }
      );
    });
  </script>
</body>
</html>
