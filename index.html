<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Envie sua foto ou vídeo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;600&display=swap">
<style>
body{font-family:'Jost',sans-serif;background:#fff;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;margin:0;padding:36px 20px 20px;box-sizing:border-box}
.card{max-width:340px;width:100%;text-align:center}
img.logo{width:264px;margin-bottom:10px}
h1{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;color:#3a3a3a;margin:0 0 6px;font-style:italic}
.rule{width:36px;height:1px;background:#ccc;margin:0 auto 26px}
.step{text-align:left;margin-bottom:18px}
.step-label{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-num{flex:none;width:22px;height:22px;border-radius:50%;background:#1a1a1a;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.step-text{font-size:13.5px;color:#3a3a3a}
.step[data-disabled="true"] .step-num{background:#ccc}
.step[data-disabled="true"] .step-text{color:#bbb}
input[type=file]{display:none}
.pick-btn,.send-btn{display:block;width:100%;padding:14px;font-size:13px;letter-spacing:1px;cursor:pointer;box-sizing:border-box;border:1px solid #1a1a1a;text-align:center}
.pick-btn{background:#fff;color:#1a1a1a}
.send-btn{background:#1a1a1a;color:#fff}
.send-btn:disabled{opacity:.3;cursor:default}
.preview-box{display:none;width:100%;height:170px;border:1px solid #eee;background:#fafafa;margin-top:12px;align-items:center;justify-content:center;overflow:hidden}
.preview-box.show{display:flex}
.preview-box img{max-width:100%;max-height:100%;object-fit:contain}
.preview-box .file-chip{font-size:13px;color:#666;word-break:break-all;padding:0 10px}
.preview-box .file-chip .icon{font-size:28px;display:block;margin-bottom:6px}
.preview-box .file-chip .hint{font-size:11px;color:#aaa;display:block;margin-top:4px}
#progressWrap{display:none;background:#eee;height:2px;margin-top:10px}
#progressBar{background:#1a1a1a;height:100%;width:0%}
#status{margin-top:14px;font-size:13px;color:#1a1a1a;min-height:16px}
.whatsapp-btn{display:none;width:100%;padding:13px;font-size:13px;letter-spacing:.5px;cursor:pointer;box-sizing:border-box;border:1px solid #25D366;background:#25D366;color:#fff;margin-top:10px;border-radius:4px}
.whatsapp-btn.show{display:block}
</style></head>
<body>
<div class="card">
<img class="logo" src="logo-preto-transparente.png" alt="">
<h1>Compartilhe esse momento do nosso casamento com a gente</h1>
<div class="rule"></div>

<div class="step">
  <div class="step-label"><span class="step-num">1</span><span class="step-text">Escolha sua foto ou um vídeo curto</span></div>
  <label class="pick-btn" for="file">Escolher foto/vídeo</label>
  <input type="file" id="file" accept="image/*,video/*">
  <div class="preview-box" id="previewBox"></div>
</div>

<div class="step" id="step2" data-disabled="true">
  <div class="step-label"><span class="step-num">2</span><span class="step-text">Confira acima e clique pra compartilhar</span></div>
  <button class="send-btn" id="sendBtn" disabled>Compartilhar foto/vídeo</button>
  <div id="progressWrap"><div id="progressBar"></div></div>
</div>

<div id="status"></div>
<button class="whatsapp-btn" id="whatsappBtn" type="button">📲 Abrir WhatsApp</button>
</div>
<script>
var API_KEY='public_kW2K8w89RM3bov5RPLomrhe2Z7DT';var ACCOUNT_ID='kW2K8w8';var WHATSAPP_NUMBER='5541997713790';
var NIGHT_CUTOFF_HOUR=19; // a partir dessa hora (do relogio do celular do convidado) o limite sobe
function getMaxFileBytes(){
  var hour=new Date().getHours();
  return (hour>=NIGHT_CUTOFF_HOUR?300:200)*1024*1024;
}
var DEBUG_FAIL=new URLSearchParams(location.search).get('debugFail'); // teste local: ?debugFail=1 simula erro sem chamar a API de verdade
var fileInput=document.getElementById('file');var sendBtn=document.getElementById('sendBtn');var statusDiv=document.getElementById('status');var progressWrap=document.getElementById('progressWrap');var progressBar=document.getElementById('progressBar');var step2=document.getElementById('step2');var previewBox=document.getElementById('previewBox');var whatsappBtn=document.getElementById('whatsappBtn');

function showFileChip(icon,name,hint){
  previewBox.innerHTML='';
  var wrap=document.createElement('div');wrap.className='file-chip';
  var iconEl=document.createElement('span');iconEl.className='icon';iconEl.textContent=icon;
  var nameEl=document.createElement('span');nameEl.textContent=name;
  wrap.appendChild(iconEl);wrap.appendChild(nameEl);
  if(hint){var hintEl=document.createElement('span');hintEl.className='hint';hintEl.textContent=hint;wrap.appendChild(hintEl);}
  previewBox.appendChild(wrap);
}

fileInput.addEventListener('change',function(){
  var file=fileInput.files[0];if(!file)return;
  whatsappBtn.classList.remove('show');
  var maxBytes=getMaxFileBytes();
  if(file.size>maxBytes){
    var mb=(file.size/1024/1024).toFixed(0);var maxMb=Math.round(maxBytes/1024/1024);
    previewBox.classList.add('show');
    showFileChip('⚠️',file.name,'Esse arquivo tem '+mb+'MB — o limite agora é '+maxMb+'MB. Tenta um vídeo mais curto, ou manda por WhatsApp:');
    sendBtn.disabled=true;step2.setAttribute('data-disabled','true');statusDiv.textContent='';
    whatsappBtn.classList.add('show');
    return;
  }
  previewBox.classList.add('show');
  if(file.type.indexOf('image')===0){
    try{
      var reader=new FileReader();
      reader.onload=function(e){previewBox.innerHTML='';var img=document.createElement('img');img.src=e.target.result;previewBox.appendChild(img);};
      reader.onerror=function(){showFileChip('📎',file.name,'carregada, pronta pra enviar');};
      reader.readAsDataURL(file);
    }catch(err){
      showFileChip('📎',file.name,'carregada, pronta pra enviar');
    }
  }else{
    showFileChip('🎬',file.name,null);
  }
  sendBtn.disabled=false;step2.setAttribute('data-disabled','false');statusDiv.textContent='';whatsappBtn.classList.remove('show');
});

whatsappBtn.addEventListener('click',function(){
  window.open('https://wa.me/'+WHATSAPP_NUMBER,'_blank');
});

function handleUploadFailure(rawResponseText){
  // Formato real da API (confirmado em 2026-09-15 com requisicoes de teste):
  // {"error":{"message":"...","code":"...","timestamp":"..."}}
  var code=null,msg=null;
  try{var parsed=JSON.parse(rawResponseText);if(parsed&&parsed.error){code=parsed.error.code;msg=parsed.error.message;}}catch(e){}
  if(code||msg)console.log('Bytescale error — code:',code,'message:',msg);
  progressWrap.style.display='none';
  statusDiv.textContent='❌ Erro ao enviar. Tenta de novo ou manda por WhatsApp:';
  sendBtn.disabled=false;whatsappBtn.classList.add('show');
}

sendBtn.addEventListener('click',function(){
  var file=fileInput.files[0];if(!file)return;
  sendBtn.disabled=true;progressWrap.style.display='block';progressBar.style.width='0%';statusDiv.textContent='Enviando... 0%';whatsappBtn.classList.remove('show');

  if(DEBUG_FAIL){
    // Teste local (?debugFail=1) — simula falha sem chamar a API de verdade, pra nao gastar espaco/tempo real
    setTimeout(function(){progressBar.style.width='45%';statusDiv.textContent='Enviando... 45%';},300);
    setTimeout(function(){
      handleUploadFailure(JSON.stringify({error:{message:'Erro simulado para teste local (?debugFail='+DEBUG_FAIL+')',code:'debug_simulated_failure',timestamp:new Date().toISOString()}}));
    },900);
    return;
  }

  var uniqueName=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+file.name;
  var url='https://api.bytescale.com/v2/accounts/'+ACCOUNT_ID+'/uploads/binary?fileName='+encodeURIComponent(uniqueName);
  var xhr=new XMLHttpRequest();
  xhr.open('POST',url,true);
  xhr.setRequestHeader('Authorization','Bearer '+API_KEY);
  xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');
  xhr.upload.onprogress=function(evt){if(evt.lengthComputable){var pct=Math.round((evt.loaded/evt.total)*100);progressBar.style.width=pct+'%';statusDiv.textContent='Enviando... '+pct+'%';}};
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<300){
      progressWrap.style.display='none';
      statusDiv.textContent='✅ Enviado! Obrigado!';
      fileInput.value='';previewBox.classList.remove('show');previewBox.innerHTML='';
      step2.setAttribute('data-disabled','true');whatsappBtn.classList.remove('show');
    }else{
      handleUploadFailure(xhr.responseText);
    }
  };
  xhr.onerror=function(){handleUploadFailure('');};
  xhr.send(file);
});
</script>
</body></html>
