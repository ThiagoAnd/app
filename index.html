<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envie sua foto ou vídeo</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f6e8e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .card { background: white; border-radius: 16px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; margin-bottom: 8px; color: #2b2320; }
  p { color: #6b5f57; font-size: 14px; margin-bottom: 24px; }
  input[type=file] { display: none; }
  .pick-btn, .send-btn { display: inline-block; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; box-sizing: border-box; margin-bottom: 12px; border: none; }
  .pick-btn { background: #efe0d6; color: #2b2320; }
  .send-btn { background: #2b2320; color: white; }
  .send-btn:disabled { opacity: 0.5; }
  #status { margin-top: 16px; font-size: 14px; color: #2b2320; min-height: 20px; }
  #filename { font-size: 13px; color: #6b5f57; margin-bottom: 12px; min-height: 18px; }
  #progressWrap { display: none; background: #efe0d6; border-radius: 8px; height: 10px; margin-bottom: 12px; overflow: hidden; }
  #progressBar { background: #2b2320; height: 100%; width: 0%; transition: width 0.15s linear; }
</style>
</head>
<body>
  <div class="card">
    <h1>📸 Envie sua foto ou vídeo</h1>
    <p>Compartilhe esse momento do nosso casamento com a gente!</p>
    <label class="pick-btn" for="file">Escolher foto ou vídeo</label>
    <input type="file" id="file" accept="image/*,video/*">
    <div id="filename"></div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <button class="send-btn" id="sendBtn" disabled>Enviar</button>
    <div id="status"></div>
  </div>

  <script>
    var API_KEY = 'public_kW2K8w89RM3bov5RPLomrhe2Z7DT';
    var ACCOUNT_ID = 'kW2K8w8';

    var fileInput = document.getElementById('file');
    var sendBtn = document.getElementById('sendBtn');
    var filenameDiv = document.getElementById('filename');
    var statusDiv = document.getElementById('status');
    var progressWrap = document.getElementById('progressWrap');
    var progressBar = document.getElementById('progressBar');

    fileInput.addEventListener('change', function() {
      if (fileInput.files.length > 0) {
        filenameDiv.textContent = fileInput.files[0].name;
        sendBtn.disabled = false;
        statusDiv.textContent = '';
      }
    });

    sendBtn.addEventListener('click', function() {
      var file = fileInput.files[0];
      if (!file) return;
      sendBtn.disabled = true;
      progressWrap.style.display = 'block';
      progressBar.style.width = '0%';
      statusDiv.textContent = 'Enviando... 0%';

      var uniqueName = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '-' + file.name;
      var url = 'https://api.bytescale.com/v2/accounts/' + ACCOUNT_ID + '/uploads/binary?fileName=' + encodeURIComponent(uniqueName);

      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + API_KEY);
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

      xhr.upload.onprogress = function(evt) {
        if (evt.lengthComputable) {
          var pct = Math.round((evt.loaded / evt.total) * 100);
          progressBar.style.width = pct + '%';
          statusDiv.textContent = 'Enviando... ' + pct + '%';
        }
      };

      xhr.onload = function() {
        progressWrap.style.display = 'none';
        if (xhr.status >= 200 && xhr.status < 300) {
          statusDiv.textContent = '✅ Enviado! Obrigado!';
          fileInput.value = '';
          filenameDiv.textContent = '';
        } else {
          statusDiv.textContent = '❌ Erro ao enviar, tenta de novo.';
          sendBtn.disabled = false;
        }
      };

      xhr.onerror = function() {
        progressWrap.style.display = 'none';
        statusDiv.textContent = '❌ Erro ao enviar, tenta de novo.';
        sendBtn.disabled = false;
      };

      xhr.send(file);
    });
  </script>
</body>
</html>
